name: Publish npm

on:
  release:
    types: [published]

jobs:
  gate:
    name: Pre-publish gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release ref and changelog
        run: python3 scripts/check_release_ref.py

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep

      - name: Run runtime gate tests
        run: ./scripts/run_runtime_gate_tests.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Node tests
        run: npm test

      - name: Validate bundled skill format
        run: python3 scripts/check_skill_format.py skills/mco-cli

      - name: Validate package/runtime version alignment
        run: python3 scripts/check_package_version.py

      - name: Run npm packaging smoke
        run: ./scripts/run_npm_packaging_smoke.sh

  publish:
    name: Publish npm package
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Require npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not configured; refusing to publish."
            exit 1
          fi

      - name: Verify npm identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          QUERY_STDERR="$(mktemp)"
          trap 'rm -f -- "$QUERY_STDERR"' EXIT
          if PUBLISHED_VERSION="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --prefer-online 2>"$QUERY_STDERR")"; then
            if [ "$PUBLISHED_VERSION" != "$PACKAGE_VERSION" ]; then
              echo "::error::Registry returned an unexpected version for ${PACKAGE_NAME}@${PACKAGE_VERSION}; refusing to publish."
              exit 1
            fi
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping npm publish. Registry returned ${PUBLISHED_VERSION}."
          elif grep -Eq '(^|[[:space:]])code[[:space:]]+E404([[:space:]]|$)' "$QUERY_STDERR"; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not published; publishing it now."
            npm publish --access public
          else
            echo "::error::Unable to determine whether ${PACKAGE_NAME}@${PACKAGE_VERSION} is published; refusing to publish."
            exit 1
          fi

      - name: Verify npm latest version
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED_VERSION=""
          for attempt in $(seq 1 12); do
            PUBLISHED_VERSION="$(npm view "${PACKAGE_NAME}@latest" version --prefer-online 2>/dev/null || true)"
            if [ "$PUBLISHED_VERSION" = "$PACKAGE_VERSION" ]; then
              break
            fi
            if [ "$attempt" -lt 12 ]; then
              echo "Waiting for npm latest: expected $PACKAGE_VERSION, got ${PUBLISHED_VERSION:-unavailable}"
              sleep 5
            fi
          done
          if [ "$PUBLISHED_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::npm latest mismatch: expected $PACKAGE_VERSION, got ${PUBLISHED_VERSION:-unavailable}"
            exit 1
          fi

      - name: Smoke test clean registry install
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          INSTALL_DIR="$(mktemp -d)"
          NPM_CACHE_DIR="$(mktemp -d)"
          cleanup() {
            rm -rf -- "$INSTALL_DIR" "$NPM_CACHE_DIR"
          }
          trap cleanup EXIT
          npm install "${PACKAGE_NAME}@${PACKAGE_VERSION}" \
            --prefix "$INSTALL_DIR" \
            --cache "$NPM_CACHE_DIR" \
            --no-audit \
            --no-fund
          MCO_BIN="$INSTALL_DIR/node_modules/.bin/mco"
          ACTUAL_VERSION="$("$MCO_BIN" --version)"
          if [ "$ACTUAL_VERSION" != "mco $PACKAGE_VERSION" ]; then
            echo "::error::clean install version mismatch: expected mco $PACKAGE_VERSION, got $ACTUAL_VERSION"
            exit 1
          fi
          "$MCO_BIN" --help >/dev/null
